<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier d'affiches - Fof-IA</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <meta name="theme-color" content="#2a0d1c">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --gold: #e6c27a; --rose: #d96a8c; }
        body {
            margin: 0; padding: 14px; color: #f6e9ee; font-family: system-ui, sans-serif;
            background: radial-gradient(circle at 20% 0%, #4a1230 0%, #1a0812 55%, #0d0408 100%) fixed;
            min-height: 100vh;
        }
        .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .top a { padding: 10px 14px; border-radius: 14px; text-decoration: none; color: var(--gold);
                 background: rgba(255,255,255,.08); border: 1px solid rgba(230,194,122,.3); font-weight: bold; }
        h1 { margin: 0; font-size: 22px; background: linear-gradient(90deg, var(--gold), var(--rose));
             -webkit-background-clip: text; background-clip: text; color: transparent; }
        canvas { width: 100%; height: auto; display: block; border-radius: 16px; border: 1px solid rgba(230,194,122,.3); }
        .panel { margin-top: 14px; padding: 14px; border-radius: 20px; background: rgba(255,255,255,.05);
                 border: 1px solid rgba(230,194,122,.25); }
        label { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--gold); }
        input[type=text], textarea, select {
            width: 100%; padding: 12px; border-radius: 12px; font-size: 16px; color: #fff;
            border: 1px solid rgba(230,194,122,.35); background: rgba(255,255,255,.08); font-family: inherit;
        }
        select option { color: #000; }
        textarea { min-height: 78px; resize: vertical; }
        input[type=range] { width: 100%; }
        button {
            padding: 14px; border: none; border-radius: 14px; font-weight: bold; font-size: 16px; cursor: pointer;
            background: linear-gradient(135deg, var(--gold), #c98a4b); color: #2a0d1c;
        }
        .row { display: flex; gap: 8px; margin-top: 12px; }
        .row button { flex: 1; }
        .hint { font-size: 13px; color: rgba(246,233,238,.65); margin-top: 6px; }
        #aiMsg { font-size: 14px; margin-top: 6px; color: var(--gold); }
    </style>
</head>
<body>
    <div class="top">
        <a href="/">← Fof-IA</a>
        <h1>Atelier d'affiches</h1>
    </div>

    <canvas id="cv" width="1080" height="1620"></canvas>

    <div class="row">
        <button onclick="dl()">⬇️ Télécharger</button>
        <button onclick="share()">📤 Partager</button>
    </div>

    <div class="panel">
        <label>Ta photo principale (toi, ta boutique…)</label>
        <input type="file" id="fPhoto" accept="image/*">
        <label>Zoom de la photo</label>
        <input type="range" id="zoom" min="100" max="250" value="100" oninput="draw()">
        <label>Position horizontale</label>
        <input type="range" id="px" min="-100" max="100" value="0" oninput="draw()">
        <label>Position verticale</label>
        <input type="range" id="py" min="-100" max="100" value="0" oninput="draw()">

        <label>Photo des produits (optionnel, en bas)</label>
        <input type="file" id="fProd" accept="image/*">

        <label>Nom de la boutique (un mot ou une ligne par ligne)</label>
        <textarea id="nom" oninput="draw()">BOUBA
SHOP
IVOIRE</textarea>

        <label>Bandeau doré</label>
        <input type="text" id="ban" value="Vendeur ambulant" oninput="draw()">

        <label>Description (une ligne par ligne)</label>
        <textarea id="desc" oninput="draw()">Vente de produits
cosmétiques et
parfums VIP</textarea>

        <label>Mots-clés en haut à gauche (optionnel)</label>
        <textarea id="mots" oninput="draw()">Beauté
Parfum
Élégance
Confiance</textarea>

        <label>Téléphone</label>
        <input type="text" id="tel" value="07 87 61 97 17" oninput="draw()">

        <label>Couleurs</label>
        <select id="theme" onchange="draw()">
            <option value="or">Or et noir</option>
            <option value="rose">Rose et noir</option>
            <option value="bleu">Bleu argent et noir</option>
        </select>

        <label>Ou crée un fond avec l'IA (remplace la photo principale)</label>
        <input type="text" id="fondTxt" placeholder="ex : boutique de parfums de luxe, lumières dorées">
        <div class="row"><button onclick="aiBg()">🎨 Créer le fond</button></div>
        <div id="aiMsg"></div>
        <div class="hint">Le texte, ton visage et ton numéro viennent de ce que tu écris et de tes vraies photos : ils sont toujours exacts. L'IA ne sert qu'à créer un fond.</div>
    </div>

    <script>
        const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
        const W = 1080, H = 1620;
        let photo = null, prods = null;
        const THEMES = {
            or: ['#fff3b0', '#f5c542', '#b8860b'],
            rose: ['#ffe0ee', '#ff6fa5', '#b0245a'],
            bleu: ['#ffffff', '#9ad1ff', '#3b82c4']
        };
        const $ = id => document.getElementById(id);

        function goldGrad(x0, y0, x1, y1) {
            const c = THEMES[$('theme').value];
            const g = ctx.createLinearGradient(x0, y0, x1, y1);
            g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, c[2]);
            return g;
        }
        function fit(text, maxW, size, fontFn) {
            let s = size;
            ctx.font = fontFn(s);
            while (ctx.measureText(text).width > maxW && s > 14) { s -= 2; ctx.font = fontFn(s); }
            return s;
        }
        function roundRect(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
        }
        function cover(c, img, x, y, w, h, zoom, ox, oy) {
            const s = Math.max(w / img.width, h / img.height) * zoom;
            const dw = img.width * s, dh = img.height * s;
            c.drawImage(img, x + (w - dw) / 2 + ox * w / 200, y + (h - dh) / 2 + oy * h / 200, dw, dh);
        }
        function lines(id, max) {
            return $(id).value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, max);
        }
        function crown(cx, y, w, h) {
            ctx.beginPath();
            ctx.moveTo(cx - w / 2, y + h);
            ctx.lineTo(cx - w / 2, y + h * 0.25);
            ctx.lineTo(cx - w / 4, y + h * 0.6);
            ctx.lineTo(cx, y);
            ctx.lineTo(cx + w / 4, y + h * 0.6);
            ctx.lineTo(cx + w / 2, y + h * 0.25);
            ctx.lineTo(cx + w / 2, y + h);
            ctx.closePath();
            ctx.fillStyle = goldGrad(cx - w / 2, y, cx + w / 2, y + h);
            ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.lineJoin = 'round';

            // Fond
            const bg = ctx.createRadialGradient(W * 0.3, 0, 50, W * 0.5, H * 0.5, H);
            bg.addColorStop(0, '#3a2a08'); bg.addColorStop(0.5, '#120c04'); bg.addColorStop(1, '#000');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

            if (photo) {
                ctx.save();
                ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
                cover(ctx, photo, 0, 0, W, H, +$('zoom').value / 100, +$('px').value, +$('py').value);
                ctx.restore();
            }

            // Voiles sombres (lisibilité du texte)
            let g = ctx.createLinearGradient(W * 0.3, 0, W, 0);
            g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.55, 'rgba(0,0,0,.78)'); g.addColorStop(1, 'rgba(0,0,0,.92)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            g = ctx.createLinearGradient(0, H * 0.58, 0, H);
            g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.6, 'rgba(0,0,0,.85)'); g.addColorStop(1, '#000');
            ctx.fillStyle = g; ctx.fillRect(0, H * 0.58, W, H * 0.42);

            // Produits en bas (fondu vers le haut)
            if (prods) {
                const o = document.createElement('canvas');
                o.width = W; o.height = 430;
                const oc = o.getContext('2d');
                cover(oc, prods, 0, 0, W, 430, 1, 0, 0);
                oc.globalCompositeOperation = 'destination-in';
                const fg = oc.createLinearGradient(0, 0, 0, 430);
                fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(0.3, 'rgba(0,0,0,1)'); fg.addColorStop(1, 'rgba(0,0,0,1)');
                oc.fillStyle = fg; oc.fillRect(0, 0, W, 430);
                ctx.drawImage(o, 0, H - 190 - 400);
            }

            const cx = W * 0.67, maxW = W * 0.56;
            ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

            // Titre
            const nom = lines('nom', 4);
            crown(cx, 60, 150, 90);
            let y = 150;
            nom.forEach((t, i) => {
                const f = s => `900 ${s}px "Arial Black", Impact, sans-serif`;
                const size = fit(t, maxW, 170, f);
                ctx.font = f(size);
                y += size * 0.98;
                ctx.lineWidth = size * 0.1; ctx.strokeStyle = '#000'; ctx.strokeText(t, cx, y);
                ctx.fillStyle = (nom.length >= 3 && i === nom.length - 1) ? '#ffffff' : goldGrad(cx - maxW / 2, y - size, cx + maxW / 2, y);
                ctx.fillText(t, cx, y);
            });

            // Trait doré
            y += 18;
            ctx.strokeStyle = goldGrad(cx - maxW / 2, y, cx + maxW / 2, y);
            ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx - maxW / 2, y); ctx.lineTo(cx + maxW / 2, y); ctx.stroke();

            // Bandeau
            const ban = $('ban').value.trim();
            if (ban) {
                y += 36;
                roundRect(ctx, cx - maxW / 2, y, maxW, 86, 14);
                ctx.fillStyle = goldGrad(cx - maxW / 2, y, cx + maxW / 2, y + 86); ctx.fill();
                const f = s => `italic 800 ${s}px Georgia, serif`;
                const size = fit(ban, maxW - 50, 54, f);
                ctx.font = f(size); ctx.fillStyle = '#000';
                ctx.fillText(ban, cx, y + 86 / 2 + size * 0.32);
                y += 86 + 34;
            } else { y += 30; }

            // Description
            const desc = lines('desc', 5);
            if (desc.length) {
                const lh = 58, ph = desc.length * lh + 44;
                roundRect(ctx, cx - maxW / 2, y, maxW, ph, 36);
                ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fill();
                ctx.lineWidth = 3; ctx.strokeStyle = goldGrad(cx - maxW / 2, y, cx + maxW / 2, y + ph); ctx.stroke();
                desc.forEach((t, i) => {
                    const f = s => `800 ${s}px Arial, sans-serif`;
                    const size = fit(t, maxW - 60, 46, f);
                    ctx.font = f(size);
                    ctx.fillStyle = i === 0 ? '#ffffff' : goldGrad(cx - maxW / 2, 0, cx + maxW / 2, 0);
                    ctx.fillText(t, cx, y + 22 + (i + 1) * lh - 14);
                });
            }

            // Mots-clés (haut gauche)
            const mots = lines('mots', 5);
            if (mots.length) {
                const lh = 52, bw = 270, bh = mots.length * lh + 40;
                roundRect(ctx, 40, 60, bw, bh, 18);
                ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = goldGrad(40, 60, 40 + bw, 60 + bh); ctx.stroke();
                mots.forEach((t, i) => {
                    const f = s => `italic 700 ${s}px Georgia, serif`;
                    const size = fit(t, bw - 40, 36, f);
                    ctx.font = f(size);
                    ctx.fillStyle = goldGrad(40, 0, 40 + bw, 0);
                    ctx.fillText(t, 40 + bw / 2, 60 + 20 + (i + 1) * lh - 12);
                });
            }

            // Barre de contact (bas)
            const by = H - 190;
            g = ctx.createLinearGradient(0, by, 0, H);
            g.addColorStop(0, 'rgba(0,0,0,.92)'); g.addColorStop(1, '#000');
            ctx.fillStyle = g; ctx.fillRect(0, by, W, 190);
            ctx.strokeStyle = goldGrad(0, by, W, by); ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(W, by); ctx.stroke();

            ctx.beginPath(); ctx.arc(110, H - 95, 62, 0, Math.PI * 2);
            ctx.fillStyle = goldGrad(48, H - 157, 172, H - 33); ctx.fill();
            ctx.font = '64px sans-serif'; ctx.fillStyle = '#000'; ctx.textAlign = 'center';
            ctx.fillText('📞', 110, H - 73);

            ctx.textAlign = 'left';
            ctx.font = '800 38px Arial, sans-serif';
            ctx.fillStyle = goldGrad(210, 0, 400, 0);
            ctx.fillText('Contact :', 210, H - 132);

            const bx = 200, bw2 = W - 260;
            roundRect(ctx, bx, H - 118, bw2, 84, 42);
            ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = goldGrad(bx, 0, bx + bw2, 0); ctx.stroke();
            const tel = $('tel').value.trim();
            ctx.textAlign = 'center';
            const f = s => `800 ${s}px Arial, sans-serif`;
            const size = fit(tel, bw2 - 60, 62, f);
            ctx.font = f(size); ctx.fillStyle = '#ffffff';
            ctx.fillText(tel, bx + bw2 / 2, H - 118 + 84 / 2 + size * 0.34);
        }

        function loadFile(file) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = r.result; };
                r.onerror = rej; r.readAsDataURL(file);
            });
        }
        $('fPhoto').onchange = async e => {
            if (e.target.files[0]) { try { photo = await loadFile(e.target.files[0]); draw(); } catch (x) { alert("Photo illisible."); } }
        };
        $('fProd').onchange = async e => {
            if (e.target.files[0]) { try { prods = await loadFile(e.target.files[0]); draw(); } catch (x) { alert("Photo illisible."); } }
        };

        function dl() {
            draw();
            const a = document.createElement('a');
            a.href = cv.toDataURL('image/png');
            a.download = 'affiche.png';
            a.click();
        }
        function share() {
            draw();
            cv.toBlob(async b => {
                const f = new File([b], 'affiche.png', {type: 'image/png'});
                if (navigator.canShare && navigator.canShare({files: [f]})) {
                    try { await navigator.share({files: [f], title: 'Affiche'}); } catch (e) {}
                } else { dl(); }
            }, 'image/png');
        }

        async function aiBg() {
            const t = $('fondTxt').value.trim();
            if (!t) { $('aiMsg').textContent = "Décris d'abord le fond."; return; }
            $('aiMsg').textContent = "Création du fond, patiente…";
            try {
                const r = await fetch('/api/image', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: t + ", no text, no letters, background for an advertising poster, vertical, high quality"})
                });
                const d = await r.json();
                if (d.image) {
                    const i = new Image();
                    i.onload = () => { photo = i; draw(); $('aiMsg').textContent = "Fond ajouté ✅"; };
                    i.src = d.image;
                } else { $('aiMsg').textContent = "Erreur : " + (d.error || "inconnue"); }
            } catch (e) { $('aiMsg').textContent = "Le serveur ne répond pas."; }
        }

        draw();
    </script>
</body>
</html>
