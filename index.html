<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fof-IA</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 16px; }
        h1 { text-align: center; margin: 4px 0 12px; }
        .opts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        select { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: none; background: #333; color: #fff; font-size: 14px; }
        #chat { height: 50vh; overflow-y: auto; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #1e1e1e; }
        .msg-user { color: #4db8ff; text-align: right; margin: 10px 0; white-space: pre-wrap; }
        .msg-bot { color: #a8ff60; text-align: left; margin: 10px 0; white-space: pre-wrap; }
        .msg-bot img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
        .input-box { display: flex; gap: 8px; }
        input[type=text] { flex: 1; min-width: 0; padding: 14px; border-radius: 8px; border: none; background: #333; color: #fff; font-size: 16px; }
        button { padding: 14px 16px; background: #4db8ff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; color: #000; }
        #mic.on { background: #ff5c5c; }
        #free.on { background: #a8ff60; }
        #free { background: #555; color: #fff; width: 100%; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>Fof-IA</h1>

    <div class="opts">
        <select id="lang"></select>
        <select id="gender">
            <option value="f">Voix de femme</option>
            <option value="m">Voix d'homme</option>
        </select>
    </div>

    <div id="chat"></div>

    <div class="input-box">
        <button id="mic" onclick="toggleMic()">🎙️</button>
        <input type="text" id="msg" placeholder="Écris ou parle..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Envoyer</button>
    </div>
    <button id="free" onclick="toggleFree()">🔁 Conversation mains libres : désactivée</button>

    <script>
        let history = [];
        let handsFree = false;
        let recog = null;
        let listening = false;

        const LANGS = [
            ["auto", "🌍 Langue : automatique", "fr-FR"],
            ["Français", "Français", "fr-FR"],
            ["English", "English", "en-US"],
            ["Bambara", "Bambara (bamanankan)", "fr-FR"],
            ["العربية", "العربية", "ar-SA"],
            ["Español", "Español", "es-ES"],
            ["Português", "Português", "pt-BR"],
            ["Deutsch", "Deutsch", "de-DE"],
            ["中文", "中文", "zh-CN"],
            ["Kiswahili", "Kiswahili", "sw-KE"]
        ];

        const langSel = document.getElementById('lang');
        LANGS.forEach(l => {
            const o = document.createElement('option');
            o.value = l[0]; o.textContent = l[1];
            langSel.appendChild(o);
        });

        function voiceLang() {
            const f = LANGS.find(l => l[0] === langSel.value);
            return f ? f[2] : "fr-FR";
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function format(t) {
            return escapeHtml(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
        }

        function cleanForSpeech(t) {
            return t.replace(/\*\*/g, '').replace(/[#*_`>]/g, '');
        }

        function speak(text) {
            if (!window.speechSynthesis) { afterSpeech(); return; }
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
            u.lang = voiceLang();
            const female = document.getElementById('gender').value === 'f';
            const voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(u.lang.slice(0, 2).toLowerCase()));
            const want = female ? /female|femme|woman|amelie|marie|julie|audrey|google/i : /male|homme|man|thomas|paul|daniel|henri/i;
            const pick = voices.find(v => want.test(v.name)) || voices[0];
            if (pick) u.voice = pick;
            u.pitch = female ? 1.25 : 0.75;
            u.rate = 1;
            u.onend = afterSpeech;
            u.onerror = afterSpeech;
            speechSynthesis.speak(u);
        }

        function afterSpeech() {
            if (handsFree && !listening) startListening();
        }

        function setMic(on) {
            listening = on;
            document.getElementById('mic').classList.toggle('on', on);
        }

        function startListening() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert("Ton navigateur ne supporte pas la reconnaissance vocale. Utilise Chrome."); return; }
            if (window.speechSynthesis) speechSynthesis.cancel();
            recog = new SR();
            recog.lang = voiceLang();
            recog.interimResults = false;
            recog.onresult = e => send(e.results[0][0].transcript);
            recog.onerror = () => { setMic(false); handsFree = false; updateFree(); };
            recog.onend = () => setMic(false);
            try { recog.start(); setMic(true); } catch (e) { setMic(false); }
        }

        function toggleMic() {
            if (listening) { recog.stop(); setMic(false); }
            else startListening();
        }

        function updateFree() {
            const b = document.getElementById('free');
            b.classList.toggle('on', handsFree);
            b.textContent = handsFree ? "🔁 Conversation mains libres : activée" : "🔁 Conversation mains libres : désactivée";
        }

        function toggleFree() {
            handsFree = !handsFree;
            updateFree();
            if (handsFree) startListening();
            else { if (recog) recog.stop(); if (window.speechSynthesis) speechSynthesis.cancel(); }
        }

        async function send(textOverride) {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const message = (typeof textOverride === 'string' ? textOverride : input.value).trim();
            if (!message) return;

            chat.innerHTML += `<div class="msg-user"><b>Toi:</b> ${escapeHtml(message)}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const imgMatch = message.match(/^(\/image|image\s*:|dessine)\s*(.+)/i);
            if (imgMatch) {
                const prompt = imgMatch[2];
                const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) + "?width=768&height=768&nologo=true&seed=" + (Date.now() % 100000);
                chat.innerHTML += `<div class="msg-bot"><b>Fof-IA:</b> Voici ton image 🎨<img src="${url}" alt="image" onerror="this.outerHTML='(Le service d\\'images ne répond pas, réessaie plus tard.)'"></div>`;
                chat.scrollTop = chat.scrollHeight;
                afterSpeech();
                return;
            }

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message, history: history, lang: langSel.value})
                });
                const data = await res.json();
                const answer = data.response || 'Pas de réponse.';
                history.push({role: "user", content: message});
                history.push({role: "assistant", content: answer});
                chat.innerHTML += `<div class="msg-bot"><b>Fof-IA:</b> ${format(answer)}</div>`;
                chat.scrollTop = chat.scrollHeight;
                speak(answer);
            } catch (e) {
                chat.innerHTML += `<div class="msg-bot"><b>Fof-IA:</b> Erreur de connexion.</div>`;
                chat.scrollTop = chat.scrollHeight;
            }
        }

        if (window.speechSynthesis) speechSynthesis.getVoices();
    </script>
</body>
</html>
