<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fof-IA</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/logo.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2a0d1c">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { --gold: #e6c27a; --rose: #d96a8c; --wine: #2a0d1c; }
        body {
            margin: 0; padding: 16px; color: #f6e9ee; font-family: system-ui, sans-serif;
            background: radial-gradient(circle at 20% 0%, #4a1230 0%, #1a0812 55%, #0d0408 100%) fixed;
            min-height: 100vh;
        }
        h1 {
            text-align: center; margin: 6px 0 14px; font-family: 'Playfair Display', Georgia, serif;
            font-style: italic; font-size: 44px; letter-spacing: 1px;
            background: linear-gradient(90deg, var(--gold), var(--rose)); -webkit-background-clip: text;
            background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(217,106,140,.35);
        }
        .opts { display: flex; gap: 8px; margin-bottom: 10px; }
        select {
            flex: 1; min-width: 0; padding: 11px; border-radius: 14px; border: 1px solid rgba(230,194,122,.35);
            background: rgba(255,255,255,.07); color: #f6e9ee; font-size: 14px;
        }
        select option { color: #000; }
        #chat {
            height: 46vh; overflow-y: auto; padding: 14px; margin-bottom: 10px; border-radius: 22px;
            background: rgba(255,255,255,.05); border: 1px solid rgba(230,194,122,.25);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(217,106,140,.15) inset;
        }
        .msg-user, .msg-bot { margin: 10px 0; padding: 10px 14px; border-radius: 18px; max-width: 88%; white-space: pre-wrap; word-wrap: break-word; }
        .msg-user { margin-left: auto; background: linear-gradient(135deg, rgba(217,106,140,.55), rgba(120,30,70,.6)); }
        .msg-bot { margin-right: auto; background: rgba(230,194,122,.12); border: 1px solid rgba(230,194,122,.25); }
        .msg-bot b, .msg-user b { color: var(--gold); }
        .msg-user img, .msg-bot img { max-width: 100%; border-radius: 14px; margin-top: 8px; display: block; }
        .input-box { display: flex; gap: 8px; }
        input[type=text] {
            flex: 1; min-width: 0; padding: 14px; border-radius: 16px; font-size: 16px; color: #fff;
            border: 1px solid rgba(230,194,122,.35); background: rgba(255,255,255,.08);
        }
        input[type=text]::placeholder { color: rgba(246,233,238,.5); }
        button {
            padding: 12px 14px; border: none; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer;
            background: linear-gradient(135deg, var(--gold), #c98a4b); color: #2a0d1c;
        }
        #mic.on { background: linear-gradient(135deg, #ff6b8a, #c4204f); color: #fff; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,107,138,.6)} 100%{box-shadow:0 0 0 16px rgba(255,107,138,0)} }
        #free { width: 100%; margin-top: 8px; background: rgba(255,255,255,.1); color: #f6e9ee; border: 1px solid rgba(230,194,122,.35); }
        #free.on { background: linear-gradient(135deg, var(--rose), #8d1f4d); color: #fff; }
        #chip { display: none; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 12px; border-radius: 14px;
                background: rgba(230,194,122,.14); border: 1px solid rgba(230,194,122,.3); font-size: 14px; }
        #chip span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #chip button { padding: 6px 10px; font-size: 13px; }
        #editor { display: none; position: fixed; inset: 0; z-index: 10; overflow-y: auto; padding: 14px;
                  background: rgba(13,4,8,.96); }
        #editor canvas { width: 100%; border-radius: 14px; }
        #editor label { display: block; margin: 10px 0 2px; font-size: 14px; color: var(--gold); }
        #editor input[type=range] { width: 100%; }
        #editor input[type=text] { width: 100%; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .row button { flex: 1; }
    </style>
</head>
<body>
    <h1>Fof-IA</h1>

    <div class="opts">
        <select id="lang"></select>
        <select id="gender">
            <option value="f">Voix de femme</option>
            <option value="m">Voix d'homme</option>
        </select>
    </div>

    <div id="chat"></div>

    <div id="chip"><span id="chipName"></span><button id="chipEdit" onclick="openEditor()">✏️ Éditer</button><button onclick="clearPending()">✕</button></div>

    <div class="input-box">
        <button onclick="document.getElementById('file').click()">📎</button>
        <button id="mic" onclick="toggleMic()">🎙️</button>
        <input type="text" id="msg" placeholder="Écris ou parle..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">➤</button>
    </div>
    <input type="file" id="file" style="display:none" accept="image/*,.txt,.md,.csv,.json,.py,.js,.html,.css,.xml,.log" onchange="onFile(this)">
    <button id="free" onclick="toggleFree()">🔁 Conversation mains libres : désactivée</button>

    <div id="editor">
        <canvas id="cv"></canvas>
        <label>Luminosité</label><input type="range" id="fBright" min="50" max="160" value="100" oninput="draw()">
        <label>Contraste</label><input type="range" id="fContrast" min="50" max="160" value="100" oninput="draw()">
        <label>Saturation</label><input type="range" id="fSat" min="0" max="200" value="100" oninput="draw()">
        <label>Flou</label><input type="range" id="fBlur" min="0" max="10" value="0" oninput="draw()">
        <div class="row">
            <button onclick="toggleF('gray')">Noir et blanc</button>
            <button onclick="toggleF('sepia')">Sépia</button>
            <button onclick="rotate()">⟳ Pivoter</button>
        </div>
        <label>Texte sur l'image</label>
        <input type="text" id="fText" placeholder="Ton texte..." oninput="draw()">
        <select id="fPos" onchange="draw()" style="width:100%;margin-top:8px"><option value="bottom">Texte en bas</option><option value="top">Texte en haut</option><option value="middle">Texte au centre</option></select>
        <div class="row">
            <button onclick="useEdited()">✅ Utiliser</button>
            <button onclick="downloadEdited()">⬇️ Télécharger</button>
            <button onclick="closeEditor()">Fermer</button>
        </div>
    </div>

    <script>
        let history = [];
        let handsFree = false, recog = null, listening = false;
        let pendingImage = "", pendingText = "", pendingName = "";
        let baseImg = null, gray = false, sepia = false;

        const LANGS = [
            ["auto", "🌍 Langue : automatique", "fr-FR"],
            ["Français", "Français", "fr-FR"],
            ["English", "English", "en-US"],
            ["Bambara", "Bambara (bamanankan)", "fr-FR"],
            ["العربية", "العربية", "ar-SA"],
            ["Español", "Español", "es-ES"],
            ["Português", "Português", "pt-BR"],
            ["Deutsch", "Deutsch", "de-DE"],
            ["中文", "中文", "zh-CN"],
            ["Kiswahili", "Kiswahili", "sw-KE"]
        ];
        const langSel = document.getElementById('lang');
        LANGS.forEach(l => { const o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; langSel.appendChild(o); });

        function voiceLang() { const f = LANGS.find(l => l[0] === langSel.value); return f ? f[2] : "fr-FR"; }
        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function format(t) { return escapeHtml(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
        function cleanForSpeech(t) { return t.replace(/\*\*/g, '').replace(/[#*_`>]/g, ''); }

        /* ---------- Voix ---------- */
        function speak(text) {
            if (!window.speechSynthesis) { afterSpeech(); return; }
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
            u.lang = voiceLang();
            const female = document.getElementById('gender').value === 'f';
            const voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(u.lang.slice(0, 2).toLowerCase()));
            const want = female ? /female|femme|woman|amelie|marie|julie|audrey|google/i : /male|homme|man|thomas|paul|daniel|henri/i;
            const pick = voices.find(v => want.test(v.name)) || voices[0];
            if (pick) u.voice = pick;
            u.pitch = female ? 1.25 : 0.75;
            u.onend = afterSpeech; u.onerror = afterSpeech;
            speechSynthesis.speak(u);
        }
        function afterSpeech() { if (handsFree && !listening) startListening(); }
        function setMic(on) { listening = on; document.getElementById('mic').classList.toggle('on', on); }
        function startListening() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert("Ton navigateur ne supporte pas la reconnaissance vocale. Utilise Chrome."); return; }
            if (window.speechSynthesis) speechSynthesis.cancel();
            recog = new SR();
            recog.lang = voiceLang();
            recog.interimResults = false;
            recog.onresult = e => send(e.results[0][0].transcript);
            recog.onerror = () => { setMic(false); handsFree = false; updateFree(); };
            recog.onend = () => setMic(false);
            try { recog.start(); setMic(true); } catch (e) { setMic(false); }
        }
        function toggleMic() { if (listening) { recog.stop(); setMic(false); } else startListening(); }
        function updateFree() {
            const b = document.getElementById('free');
            b.classList.toggle('on', handsFree);
            b.textContent = handsFree ? "🔁 Conversation mains libres : activée" : "🔁 Conversation mains libres : désactivée";
        }
        function toggleFree() {
            handsFree = !handsFree; updateFree();
            if (handsFree) startListening();
            else { if (recog) recog.stop(); if (window.speechSynthesis) speechSynthesis.cancel(); }
        }

        /* ---------- Fichiers ---------- */
        function loadImg(src) {
            return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
        }
        function readFile(file, asText) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => res(r.result); r.onerror = rej;
                asText ? r.readAsText(file) : r.readAsDataURL(file);
            });
        }
        function shrink(img, max) {
            const w = img.width, h = img.height;
            const s = Math.min(1, max / Math.max(w, h));
            const c = document.createElement('canvas');
            c.width = Math.round(w * s); c.height = Math.round(h * s);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            return c.toDataURL('image/jpeg', 0.85);
        }
        async function onFile(inp) {
            const file = inp.files[0]; inp.value = "";
            if (!file) return;
            clearPending();
            try {
                if (file.type.startsWith("image/")) {
                    const img = await loadImg(await readFile(file, false));
                    pendingImage = shrink(img, 1024);
                    pendingName = file.name;
                    showChip("🖼️ " + file.name, true);
                } else if (/\.pdf$/i.test(file.name)) {
                    alert("Les PDF ne sont pas encore pris en charge. Envoie une capture d'écran ou un fichier texte.");
                } else {
                    let t = await readFile(file, true);
                    if (t.length > 12000) t = t.slice(0, 12000) + "\n[...fichier coupé...]";
                    pendingText = t; pendingName = file.name;
                    showChip("📄 " + file.name, false);
                }
            } catch (e) { alert("Impossible de lire ce fichier."); }
        }
        function showChip(name, canEdit) {
            document.getElementById('chip').style.display = 'flex';
            document.getElementById('chipName').textContent = name;
            document.getElementById('chipEdit').style.display = canEdit ? 'inline-block' : 'none';
        }
        function clearPending() {
            pendingImage = ""; pendingText = ""; pendingName = "";
            document.getElementById('chip').style.display = 'none';
        }

        /* ---------- Éditeur de photo ---------- */
        async function openEditor() {
            if (!pendingImage) return;
            baseImg = await loadImg(pendingImage);
            gray = false; sepia = false;
            ['fBright','fContrast','fSat'].forEach(id => document.getElementById(id).value = 100);
            document.getElementById('fBlur').value = 0;
            document.getElementById('fText').value = "";
            document.getElementById('editor').style.display = 'block';
            draw();
        }
        function closeEditor() { document.getElementById('editor').style.display = 'none'; }
        function toggleF(w) { if (w === 'gray') gray = !gray; else sepia = !sepia; draw(); }
        function rotate() {
            const c = document.createElement('canvas');
            c.width = baseImg.height; c.height = baseImg.width;
            const x = c.getContext('2d');
            x.translate(c.width / 2, c.height / 2); x.rotate(Math.PI / 2);
            x.drawImage(baseImg, -baseImg.width / 2, -baseImg.height / 2);
            loadImg(c.toDataURL('image/jpeg', 0.9)).then(i => { baseImg = i; draw(); });
        }
        function draw() {
            if (!baseImg) return;
            const cv = document.getElementById('cv'), x = cv.getContext('2d');
            cv.width = baseImg.width; cv.height = baseImg.height;
            const b = document.getElementById('fBright').value, c = document.getElementById('fContrast').value,
                  s = document.getElementById('fSat').value, bl = document.getElementById('fBlur').value;
            x.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px)` + (gray ? " grayscale(1)" : "") + (sepia ? " sepia(1)" : "");
            x.drawImage(baseImg, 0, 0);
            x.filter = "none";
            const t = document.getElementById('fText').value;
            if (t) {
                const size = Math.max(20, Math.round(cv.width / 12));
                x.font = `bold ${size}px Georgia, serif`;
                x.textAlign = "center"; x.fillStyle = "#fff"; x.strokeStyle = "rgba(0,0,0,.75)"; x.lineWidth = size / 8;
                const pos = document.getElementById('fPos').value;
                const y = pos === 'top' ? size * 1.3 : pos === 'middle' ? cv.height / 2 : cv.height - size * 0.6;
                x.strokeText(t, cv.width / 2, y, cv.width * 0.95);
                x.fillText(t, cv.width / 2, y, cv.width * 0.95);
            }
        }
        function useEdited() {
            pendingImage = shrink(document.getElementById('cv'), 1024);
            closeEditor();
        }
        function downloadEdited() {
            const a = document.createElement('a');
            a.href = document.getElementById('cv').toDataURL('image/jpeg', 0.92);
            a.download = "fof-ia-photo.jpg";
            a.click();
        }

        /* ---------- Chat ---------- */
        function addBotImage(url) {
            const chat = document.getElementById('chat');
            const wrap = document.createElement('div');
            wrap.className = 'msg-bot';
            wrap.innerHTML = '<b>Fof-IA:</b> Voici ton image 🎨';
            const img = document.createElement('img');
            img.src = url;
            img.onerror = () => { img.remove(); wrap.innerHTML += '<br>(Le service d\'images ne répond pas, réessaie plus tard.)'; };
            wrap.appendChild(img);
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send(textOverride) {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            let message = (typeof textOverride === 'string' ? textOverride : input.value).trim();
            if (!message && !pendingImage && !pendingText) return;
            if (!message) message = pendingImage ? "Décris et analyse cette image." : "Analyse ce fichier.";

            let toSend = message, shown = escapeHtml(message);
            const img = pendingImage;
            if (pendingText) { toSend = message + "\n\n[Contenu du fichier " + pendingName + "]\n" + pendingText; shown += "<br>📄 " + escapeHtml(pendingName); }
            if (img) shown += `<img src="${img}">`;
            const hadFile = !!(img || pendingText);
            clearPending();

            chat.innerHTML += `<div class="msg-user"><b>Toi:</b> ${shown}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const imgMatch = !hadFile ? message.match(/^(\/image|image\s*:|dessine|affiche\s*:)\s*(.+)/i) : null;
            if (imgMatch) {
                let prompt = imgMatch[2];
                if (/^affiche/i.test(imgMatch[1])) prompt += ", poster design, elegant typography, high quality";
                addBotImage("https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) + "?width=768&height=1024&nologo=true&seed=" + (Date.now() % 100000));
                afterSpeech();
                return;
            }

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: toSend, history: history, lang: langSel.value, image: img})
                });
                const data = await res.json();
                const answer = data.response || 'Pas de réponse.';
                history.push({role: "user", content: message + (hadFile ? " (fichier joint)" : "")});
                history.push({role: "assistant", content: answer});
                chat.innerHTML += `<div class="msg-bot"><b>Fof-IA:</b> ${format(answer)}</div>`;
                chat.scrollTop = chat.scrollHeight;
                speak(answer);
            } catch (e) {
                chat.innerHTML += `<div class="msg-bot"><b>Fof-IA:</b> Erreur de connexion.</div>`;
                chat.scrollTop = chat.scrollHeight;
            }
        }

        if (window.speechSynthesis) speechSynthesis.getVoices();
    </script>
</body>
</html>
